<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" opacity="0.05">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0d1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1625;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0d1a;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0f0d1a;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0f0d1a;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Glow effects -->
  <circle cx="200" cy="150" r="400" fill="url(#glow1)"/>
  <circle cx="1000" cy="650" r="500" fill="url(#glow2)"/>

  <!-- Minimalistic geometric elements - top left -->
  <g opacity="0.15" stroke="#a78bfa" stroke-width="1.5" fill="none">
    <circle cx="150" cy="100" r="80"/>
    <circle cx="150" cy="100" r="50"/>
    <circle cx="150" cy="100" r="20"/>
  </g>

  <!-- Connecting lines - abstract network -->
  <g opacity="0.08" stroke="#fbbf24" stroke-width="1">
    <line x1="150" y1="100" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="600" y2="100"/>
    <line x1="600" y1="100" x2="800" y2="300"/>
    <line x1="800" y1="300" x2="1000" y2="200"/>
  </g>

  <!-- Connection nodes on lines -->
  <g fill="#fbbf24" opacity="0.2">
    <circle cx="150" cy="100" r="4"/>
    <circle cx="400" cy="200" r="4"/>
    <circle cx="600" cy="100" r="4"/>
    <circle cx="800" cy="300" r="4"/>
    <circle cx="1000" cy="200" r="4"/>
  </g>

  <!-- Bottom right geometric shape -->
  <g opacity="0.12" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <polygon points="1050,650 1100,700 1050,750 1000,700"/>
    <polygon points="1050,650 1100,700 1050,750 1000,700" transform="translate(40, 40)" opacity="0.5"/>
  </g>

  <!-- Floating abstract shapes - top right -->
  <g opacity="0.1">
    <path d="M 950 150 Q 1000 100 1050 150 T 1150 150" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <path d="M 1000 200 L 1050 150 L 1100 200" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Left side abstract lines -->
  <g opacity="0.08" stroke="#a78bfa" stroke-width="1">
    <path d="M 50 300 Q 100 350 150 300"/>
    <path d="M 50 400 L 200 400"/>
    <path d="M 30 500 Q 80 550 130 500"/>
  </g>

  <!-- Subtle corner accent - top right -->
  <g opacity="0.15">
    <line x1="1150" y1="20" x2="1150" y2="80" stroke="#fbbf24" stroke-width="2"/>
    <line x1="1090" y1="20" x2="1150" y2="20" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Subtle corner accent - bottom left -->
  <g opacity="0.15">
    <line x1="50" y1="750" x2="50" y2="810" stroke="#a78bfa" stroke-width="2"/>
    <line x1="50" y1="800" x2="110" y2="800" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <!-- Center accent circle (very subtle) -->
  <circle cx="600" cy="400" r="150" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.05"/>
  <circle cx="600" cy="400" r="100" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.05"/>
  <circle cx="600" cy="400" r="50" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.05"/>
</svg>
